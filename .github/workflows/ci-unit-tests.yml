name: CI Unit Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest # Specifies the runner environment

    defaults:
      run:
        working-directory: ./client # Sets the working directory for all run steps

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x] # Tests across multiple Node.js versions

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Action to check out your repository

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3 # Action to set up the Node.js environment
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # Caches dependencies for faster builds

      - name: Install dependencies
        run: npm ci # Performs a clean install of dependencies

      - name: Run tests
        run: npm test # Executes the "test" script defined in your package.json
